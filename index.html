<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATX TURF - Batting Cage Dimensions</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>
    <style>
        :root {
            --primary: #00ff9d;
            --primary-dark: #00cc7d;
            --secondary: #0a1a12;
            --accent: #00ffcc;
            --text: #e0ffe9;
            --background: #0a1a12;
            --card: #112218;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 255, 157, 0.05) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(0, 255, 204, 0.05) 0%, transparent 20%);
        }

        .logo-container {
            margin-bottom: 2rem;
            text-align: center;
        }

        .logo {
            max-width: 300px;
            height: auto;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        @media (min-width: 768px) {
            .container {
                grid-template-columns: 2fr 1fr;
            }
        }

        .form-container {
            background-color: var(--card);
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: 0 8px 32px rgba(0, 255, 157, 0.1);
            border: 1px solid rgba(0, 255, 157, 0.1);
            backdrop-filter: blur(4px);
        }

        h1 {
            color: var(--primary);
            margin-bottom: 1.5rem;
            font-weight: 600;
            font-size: 1.8rem;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            padding-bottom: 0.5rem;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 25%;
            width: 50%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--primary);
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border-radius: 0.5rem;
            border: 1px solid rgba(0, 255, 157, 0.3);
            background-color: rgba(10, 26, 18, 0.8);
            color: var(--text);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(0, 255, 157, 0.2);
        }

        button {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 0.5rem;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: var(--secondary);
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 255, 157, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .canvas-container {
            background-color: var(--card);
            border-radius: 1rem;
            overflow: hidden;
            position: relative;
            /* Increased height by 30% by changing aspect ratio from 16/9 to 16/11.7 */
            aspect-ratio: 16/11.7;
            box-shadow: 0 8px 32px rgba(0, 255, 157, 0.1);
            border: 1px solid rgba(0, 255, 157, 0.1);
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .dimensions-display {
            position: absolute;
            bottom: 1rem;
            left: 1rem;
            background-color: rgba(10, 26, 18, 0.8);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            border-left: 3px solid var(--primary);
            font-size: 0.9rem;
        }

        .instructions {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background-color: rgba(10, 26, 18, 0.8);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.8rem;
            color: var(--text);
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <img src="images/logo.png" alt="ATX TURF - Artificial Turf" class="logo">
    </div>
    
    <div class="container">
        <div class="canvas-container">
            <canvas id="cageCanvas"></canvas>
            <div class="dimensions-display" id="dimensionsDisplay">
                Length: 70 ft × Width: 14 ft × Height: 12 ft
            </div>
            <div class="instructions">
                Drag to rotate | Scroll to zoom
            </div>
        </div>
        <div class="form-container">
            <h1>Enter Your Batting Cage Dimensions</h1>
            <form id="dimensionsForm">
                <div class="form-group">
                    <label for="length">Length (feet)</label>
                    <input type="number" id="length" name="length" min="1" step="0.1" value="70" required>
                </div>
                <div class="form-group">
                    <label for="width">Width (feet)</label>
                    <input type="number" id="width" name="width" min="1" step="0.1" value="14" required>
                </div>
                <div class="form-group">
                    <label for="height">Height (feet)</label>
                    <input type="number" id="height" name="height" min="1" step="0.1" value="12" required>
                </div>
                <button type="submit">Update Dimensions</button>
            </form>
        </div>
    </div>

    <script>
        // Initialize Three.js scene
        let scene, camera, renderer, cage, controls;
        
        // Set up the scene
        function init() {
            // Create scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x112218);
            
            // Create camera
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            // Position camera for overhead diagonal view
            camera.position.set(50, 60, 70);
            camera.lookAt(0, 0, 0);
            
            // Create renderer
            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('cageCanvas'), antialias: true });
            renderer.setSize(document.querySelector('.canvas-container').clientWidth, document.querySelector('.canvas-container').clientHeight);
            
            // Add orbit controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            
            // Add lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0x00ff9d, 0.8);
            directionalLight.position.set(5, 10, 7);
            scene.add(directionalLight);
            
            const directionalLight2 = new THREE.DirectionalLight(0x00ffcc, 0.4);
            directionalLight2.position.set(-5, -10, 7);
            scene.add(directionalLight2);
            
            // Create grid
            const gridHelper = new THREE.GridHelper(100, 100, 0x004d33, 0x004d33);
            gridHelper.position.y = -10;
            scene.add(gridHelper);
            
            // Create initial cage
            createCage(70, 14, 12);
            
            // Animation loop
            animate();
            
            // Handle window resize
            window.addEventListener('resize', onWindowResize);
        }
        
        // Create or update the cage
        function createCage(length, width, height) {
            // Remove existing cage if it exists
            if (cage) {
                scene.remove(cage);
            }
            
            // Create cage group
            cage = new THREE.Group();
            
            // Create wireframe material
            const wireMaterial = new THREE.LineBasicMaterial({ color: 0x00ff9d });
            
            // Create solid material with transparency
            const solidMaterial = new THREE.MeshPhongMaterial({
                color: 0x00ff9d,
                transparent: true,
                opacity: 0.1,
                side: THREE.DoubleSide
            });
            
            // Create cage geometry
            const geometry = new THREE.BoxGeometry(width, height, length);
            
            // Create wireframe
            const wireframe = new THREE.LineSegments(
                new THREE.EdgesGeometry(geometry),
                wireMaterial
            );
            
            // Create solid mesh
            const solid = new THREE.Mesh(geometry, solidMaterial);
            
            // Add to cage group
            cage.add(wireframe);
            cage.add(solid);
            
            // Add cage to scene
            scene.add(cage);
            
            // Update dimensions display
            document.getElementById('dimensionsDisplay').textContent = 
                `Length: ${length} ft × Width: ${width} ft × Height: ${height} ft`;
        }
        
        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        
        // Handle window resize
        function onWindowResize() {
            const container = document.querySelector('.canvas-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }
        
        // Handle form submission
        document.getElementById('dimensionsForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const length = parseFloat(document.getElementById('length').value);
            const width = parseFloat(document.getElementById('width').value);
            const height = parseFloat(document.getElementById('height').value);
            
            if (length > 0 && width > 0 && height > 0) {
                createCage(length, width, height);
            }
        });
        
        // Handle input changes for real-time updates
        const inputs = document.querySelectorAll('#dimensionsForm input');
        inputs.forEach(input => {
            input.addEventListener('input', function() {
                const length = parseFloat(document.getElementById('length').value) || 70;
                const width = parseFloat(document.getElementById('width').value) || 14;
                const height = parseFloat(document.getElementById('height').value) || 12;
                
                if (length > 0 && width > 0 && height > 0) {
                    createCage(length, width, height);
                }
            });
        });
        
        // Initialize the scene when the page loads
        window.onload = init;
    </script>
</body>
</html>
