<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATX TURF - Batting Cage Dimensions</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>
    <style>
        :root {
            --primary: #00ff9d;
            --primary-dark: #00cc7d;
            --secondary: #0a1a12;
            --accent: #00ffcc;
            --text: #e0ffe9;
            --background: #0a1a12;
            --card: #112218;
            --atx-green: #008f39; /* Darker green for ATXTurf text */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 255, 157, 0.05) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(0, 255, 204, 0.05) 0%, transparent 20%);
        }

        .container {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
            margin-top: 0.5rem;
        }

        @media (min-width: 768px) {
            .container {
                grid-template-columns: 1.5fr 1fr;
            }
        }

        .form-container {
            background-color: var(--card);
            border-radius: 0.75rem;
            padding: 1rem;
            box-shadow: 0 8px 32px rgba(0, 255, 157, 0.1);
            border: 1px solid rgba(0, 255, 157, 0.1);
            backdrop-filter: blur(4px);
        }

        h1 {
            color: var(--primary);
            margin-bottom: 0.75rem;
            font-weight: 600;
            font-size: 1rem;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            padding-bottom: 0.25rem;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 25%;
            width: 50%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
        }

        .form-group {
            margin-bottom: 0.75rem;
            position: relative;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.25rem;
            color: var(--primary);
            font-weight: 500;
            font-size: 0.85rem;
        }

        input {
            width: 100%;
            padding: 0.5rem;
            border-radius: 0.5rem;
            border: 1px solid rgba(0, 255, 157, 0.3);
            background-color: rgba(10, 26, 18, 0.8);
            color: var(--text);
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        /* Ensure number input controls are visible */
        input[type="number"] {
            -moz-appearance: textfield; /* Firefox */
            padding-right: 1.5rem; /* Make room for custom controls */
        }

        /* Hide default controls but keep them accessible */
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { 
            -webkit-appearance: none;
            margin: 0;
        }

        /* Custom number controls */
        .number-controls {
            position: absolute;
            right: 0;
            top: 1.4rem; /* Position below label */
            display: flex;
            flex-direction: column;
            height: calc(100% - 1.4rem);
        }

        .number-control {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 1.5rem;
            height: 50%;
            background-color: rgba(0, 255, 157, 0.2);
            color: var(--text);
            font-size: 0.8rem;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.2s;
        }

        .number-control:first-child {
            border-top-right-radius: 0.5rem;
        }

        .number-control:last-child {
            border-bottom-right-radius: 0.5rem;
        }

        .number-control:hover {
            background-color: rgba(0, 255, 157, 0.4);
        }

        .number-control:active {
            background-color: rgba(0, 255, 157, 0.6);
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(0, 255, 157, 0.2);
        }

        button {
            width: 100%;
            padding: 0.5rem;
            border: none;
            border-radius: 0.5rem;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: var(--secondary);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 0.5rem;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 255, 157, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .totals-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }

        .total-square-feet {
            text-align: center;
            padding: 0.5rem;
            background-color: rgba(0, 255, 157, 0.1);
            border-radius: 0.5rem;
            border: 1px solid rgba(0, 255, 157, 0.2);
        }

        .total-square-feet-label {
            display: block;
            font-size: 0.7rem;
            margin-bottom: 0.25rem;
            color: var(--primary);
        }

        .total-square-feet-value {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text);
        }

        .total-square-feet-net {
            text-align: center;
            padding: 0.5rem;
            background-color: rgba(0, 255, 204, 0.1);
            border-radius: 0.5rem;
            border: 1px solid rgba(0, 255, 204, 0.2);
        }

        .canvas-container {
            background-color: var(--card);
            border-radius: 0.75rem;
            overflow: hidden;
            position: relative;
            aspect-ratio: 16/15.21;
            box-shadow: 0 8px 32px rgba(0, 255, 157, 0.1);
            border: 1px solid rgba(0, 255, 157, 0.1);
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .dimensions-display {
            position: absolute;
            bottom: 1rem;
            left: 1rem;
            background-color: rgba(10, 26, 18, 0.8);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            border-left: 3px solid var(--primary);
            font-size: 0.5rem;
        }

        .instructions {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background-color: rgba(10, 26, 18, 0.8);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.7rem;
            color: var(--text);
            opacity: 0.8;
        }

        .powered-by {
            position: absolute;
            bottom: 1rem;
            right: 1rem;
            background-color: rgba(10, 26, 18, 0.8);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.7rem;
            color: var(--text);
            border-right: 3px solid var(--atx-green);
        }

        .powered-by span {
            color: var(--atx-green);
            font-weight: 600;
        }

        /* Mobile-specific adjustments */
        @media (max-width: 767px) {
            .container {
                gap: 0.5rem;
            }
            
            .canvas-container {
                aspect-ratio: 16/12; /* Shorter viewport on mobile */
            }
            
            .form-container {
                padding: 0.75rem;
            }
            
            .dimensions-display, .instructions, .powered-by {
                padding: 0.25rem 0.5rem;
                font-size: 0.6rem;
            }
            
            /* Ensure number controls are visible and easy to tap on mobile */
            .number-control {
                width: 1.8rem;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="canvas-container">
            <canvas id="cageCanvas"></canvas>
            <div class="dimensions-display" id="dimensionsDisplay">
                Length: 70 ft × Width: 14 ft × Height: 12 ft
            </div>
            <div class="instructions">
                Drag to rotate | Pinch to zoom
            </div>
            <div class="powered-by">
                Powered by <span>ATXTurf, LLC</span>
            </div>
        </div>
        <div class="form-container">
            <h1>Enter Cage Size</h1>
            <form id="dimensionsForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="length">Length (feet)</label>
                        <input type="number" id="length" name="length" min="1" step="1" value="70" required>
                        <div class="number-controls">
                            <div class="number-control" data-input="length" data-action="increment">+</div>
                            <div class="number-control" data-input="length" data-action="decrement">-</div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="width">Width (feet)</label>
                        <input type="number" id="width" name="width" min="1" step="1" value="14" required>
                        <div class="number-controls">
                            <div class="number-control" data-input="width" data-action="increment">+</div>
                            <div class="number-control" data-input="width" data-action="decrement">-</div>
                        </div>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="height">Height (feet)</label>
                        <input type="number" id="height" name="height" min="1" step="1" value="12" required>
                        <div class="number-controls">
                            <div class="number-control" data-input="height" data-action="increment">+</div>
                            <div class="number-control" data-input="height" data-action="decrement">-</div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="cageCount">How Many Cages?</label>
                        <input type="number" id="cageCount" name="cageCount" min="1" max="10" step="1" value="1" required>
                        <div class="number-controls">
                            <div class="number-control" data-input="cageCount" data-action="increment">+</div>
                            <div class="number-control" data-input="cageCount" data-action="decrement">-</div>
                        </div>
                    </div>
                </div>
                <button type="submit">Update Dimensions</button>
                <div class="totals-container">
                    <div class="total-square-feet">
                        <span class="total-square-feet-label">Total Square Feet of Turf</span>
                        <div class="total-square-feet-value" id="totalSquareFeet">980</div>
                    </div>
                    <div class="total-square-feet-net">
                        <span class="total-square-feet-label">Total Square Feet of Net</span>
                        <div class="total-square-feet-value" id="totalSquareFeetNet">2,968</div>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Initialize Three.js scene
        let scene, camera, renderer, controls;
        let cages = [];
        let textLabels = [];
        
        // Set up the scene
        function init() {
            // Create scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x112218);
            
            // Create camera
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            // Position camera for overhead diagonal view
            camera.position.set(50, 60, 70);
            camera.lookAt(0, 0, 0);
            
            // Create renderer
            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('cageCanvas'), antialias: true });
            renderer.setSize(document.querySelector('.canvas-container').clientWidth, document.querySelector('.canvas-container').clientHeight);
            
            // Add orbit controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            
            // Add lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0x00ff9d, 0.8);
            directionalLight.position.set(5, 10, 7);
            scene.add(directionalLight);
            
            const directionalLight2 = new THREE.DirectionalLight(0x00ffcc, 0.4);
            directionalLight2.position.set(-5, -10, 7);
            scene.add(directionalLight2);
            
            // Create grid
            const gridHelper = new THREE.GridHelper(200, 200, 0x004d33, 0x004d33);
            gridHelper.position.y = -10;
            scene.add(gridHelper);
            
            // Create initial cage(s)
            createCages(70, 14, 12, 1);
            
            // Update total square feet display
            updateTotalSquareFeet(70, 14, 1);
            updateTotalSquareFeetNet(70, 14, 12, 1);
            
            // Animation loop
            animate();
            
            // Handle window resize
            window.addEventListener('resize', onWindowResize);
            
            // Set up custom number input controls
            setupNumberControls();
        }
        
        // Set up custom number input controls
        function setupNumberControls() {
            const numberControls = document.querySelectorAll('.number-control');
            
            numberControls.forEach(control => {
                control.addEventListener('click', function() {
                    const inputId = this.getAttribute('data-input');
                    const action = this.getAttribute('data-action');
                    const input = document.getElementById(inputId);
                    
                    let value = parseInt(input.value) || 0;
                    const step = parseInt(input.getAttribute('step')) || 1;
                    const min = parseInt(input.getAttribute('min')) || 0;
                    const max = parseInt(input.getAttribute('max')) || Infinity;
                    
                    if (action === 'increment') {
                        value = Math.min(value + step, max);
                    } else if (action === 'decrement') {
                        value = Math.max(value - step, min);
                    }
                    
                    input.value = value;
                    
                    // Trigger input event to update the 3D model
                    const event = new Event('input', { bubbles: true });
                    input.dispatchEvent(event);
                });
            });
        }
        
        // Update total square feet display
        function updateTotalSquareFeet(length, width, count) {
            const totalSqFt = Math.round(length * width * count);
            document.getElementById('totalSquareFeet').textContent = totalSqFt.toLocaleString();
        }
        
        // Update total square feet of net display
        function updateTotalSquareFeetNet(length, width, height, count) {
            // Calculate net square footage for a single cage
            const topSide = length * width;
            const frontAndBackSides = length * height * 2;
            const leftAndRightSides = width * height * 2;
            const singleCageNet = topSide + frontAndBackSides + leftAndRightSides;
            
            // For multiple cages, subtract the redundant long sides
            let totalNetSqFt;
            if (count === 1) {
                totalNetSqFt = singleCageNet;
            } else {
                // Subtract one long side (length × height) for each additional cage
                const redundantSides = (length * height) * (count - 1);
                totalNetSqFt = (singleCageNet * count) - redundantSides;
            }
            
            document.getElementById('totalSquareFeetNet').textContent = Math.round(totalNetSqFt).toLocaleString();
        }
        
        // Create text texture
        function createTextTexture(text, width, height, rotate90 = false) {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            
            // Set canvas size - swap width and height if rotating
            if (rotate90) {
                canvas.width = height;
                canvas.height = width;
            } else {
                canvas.width = width;
                canvas.height = height;
            }
            
            // Clear canvas
            context.clearRect(0, 0, canvas.width, canvas.height);
            
            if (rotate90) {
                // Set text properties for rotated text
                const fontSize = Math.min(width, height) * 0.3;
                context.font = `bold ${fontSize}px Arial`;
                
                // Save the current context state
                context.save();
                
                // Translate and rotate the context
                context.translate(canvas.width / 2, canvas.height / 2);
                context.rotate(Math.PI / 2);
                
                // Set text alignment for rotated text
                context.textAlign = 'center';
                context.textBaseline = 'middle';
                
                // Add gradient for better visibility
                context.fillStyle = 'white';
                context.strokeStyle = 'rgba(0, 0, 0, 0.5)';
                context.lineWidth = fontSize * 0.05;
                
                // Draw rotated text
                context.strokeText(text, 0, 0);
                context.fillText(text, 0, 0);
                
                // Restore the context to its original state
                context.restore();
            } else {
                // Set text properties for normal text
                const fontSize = Math.min(width, height) * 0.3;
                context.font = `bold ${fontSize}px Arial`;
                context.textAlign = 'center';
                context.textBaseline = 'middle';
                
                // Add gradient for better visibility
                context.fillStyle = 'white';
                context.strokeStyle = 'rgba(0, 0, 0, 0.5)';
                context.lineWidth = fontSize * 0.05;
                
                // Draw text
                context.strokeText(text, canvas.width / 2, canvas.height / 2);
                context.fillText(text, canvas.width / 2, canvas.height / 2);
            }
            
            // Create texture
            const texture = new THREE.CanvasTexture(canvas);
            texture.needsUpdate = true;
            
            return texture;
        }
        
        // Add text to cage
        function addTextToCage(length, width, height, xOffset = 0) {
            const text = "ATXTurf.com";
            
            // Create materials for each side with text
            const frontTexture = createTextTexture(text, 1024, 512);
            const backTexture = createTextTexture(text, 1024, 512);
            const leftTexture = createTextTexture(text, 1024, 512);
            const rightTexture = createTextTexture(text, 1024, 512);
            const topTexture = createTextTexture(text, 1024, 512, true); // Rotate text 90 degrees
            
            // Create materials with the textures
            const frontMaterial = new THREE.MeshBasicMaterial({ 
                map: frontTexture, 
                transparent: true,
                side: THREE.DoubleSide
            });
            
            const backMaterial = new THREE.MeshBasicMaterial({ 
                map: backTexture, 
                transparent: true,
                side: THREE.DoubleSide
            });
            
            const leftMaterial = new THREE.MeshBasicMaterial({ 
                map: leftTexture, 
                transparent: true,
                side: THREE.DoubleSide
            });
            
            const rightMaterial = new THREE.MeshBasicMaterial({ 
                map: rightTexture, 
                transparent: true,
                side: THREE.DoubleSide
            });
            
            const topMaterial = new THREE.MeshBasicMaterial({ 
                map: topTexture, 
                transparent: true,
                side: THREE.DoubleSide
            });
            
            // Create planes for each side
            // Front side (positive Z)
            const frontPlane = new THREE.Mesh(
                new THREE.PlaneGeometry(width * 0.85, height * 0.45),
                frontMaterial
            );
            frontPlane.position.set(xOffset, 0, length / 2 + 0.1);
            frontPlane.rotation.y = Math.PI;
            scene.add(frontPlane);
            textLabels.push(frontPlane);
            
            // Back side (negative Z)
            const backPlane = new THREE.Mesh(
                new THREE.PlaneGeometry(width * 0.85, height * 0.45),
                backMaterial
            );
            backPlane.position.set(xOffset, 0, -length / 2 - 0.1);
            scene.add(backPlane);
            textLabels.push(backPlane);
            
            // Only add side labels for the first and last cage
            // Left side (negative X)
            if (xOffset === 0) {
                const leftPlane = new THREE.Mesh(
                    new THREE.PlaneGeometry(length * 0.85, height * 0.45),
                    leftMaterial
                );
                leftPlane.position.set(xOffset - width / 2 - 0.1, 0, 0);
                leftPlane.rotation.y = Math.PI / 2;
                scene.add(leftPlane);
                textLabels.push(leftPlane);
            }
            
            // Top side (positive Y)
            const topPlane = new THREE.Mesh(
                new THREE.PlaneGeometry(width * 0.85, length * 0.85),
                topMaterial
            );
            topPlane.position.set(xOffset, height / 2 + 0.1, 0);
            topPlane.rotation.x = -Math.PI / 2;
            scene.add(topPlane);
            textLabels.push(topPlane);
            
            // Right side label for the last cage will be added separately
            return {
                rightTexture: rightTexture,
                rightMaterial: rightMaterial,
                length: length,
                height: height
            };
        }
        
        // Create or update multiple cages
        function createCages(length, width, height, count) {
            // Round values to whole numbers
            length = Math.round(length);
            width = Math.round(width);
            height = Math.round(height);
            
            // Remove existing cages and text labels
            cages.forEach(cage => scene.remove(cage));
            cages = [];
            
            textLabels.forEach(label => scene.remove(label));
            textLabels = [];
            
            // Store info for the right side label of the last cage
            let lastCageInfo;
            
            // Create multiple cages side by side
            for (let i = 0; i < count; i++) {
                // Calculate x offset for this cage
                const xOffset = i * width - ((count - 1) * width / 2);
                
                // Create cage group
                const cage = new THREE.Group();
                
                // Create wireframe material
                const wireMaterial = new THREE.LineBasicMaterial({ color: 0x00ff9d });
                
                // Create solid material with transparency
                const solidMaterial = new THREE.MeshPhongMaterial({
                    color: 0x00ff9d,
                    transparent: true,
                    opacity: 0.1,
                    side: THREE.DoubleSide
                });
                
                // Create cage geometry
                const geometry = new THREE.BoxGeometry(width, height, length);
                
                // Create wireframe
                const wireframe = new THREE.LineSegments(
                    new THREE.EdgesGeometry(geometry),
                    wireMaterial
                );
                
                // Create solid mesh
                const solid = new THREE.Mesh(geometry, solidMaterial);
                
                // Add to cage group
                cage.add(wireframe);
                cage.add(solid);
                
                // Position cage
                cage.position.set(xOffset, 0, 0);
                
                // Add cage to scene
                scene.add(cage);
                cages.push(cage);
                
                // Add text labels to the cage
                lastCageInfo = addTextToCage(length, width, height, xOffset);
            }
            
            // Add right side label for the last cage
            if (lastCageInfo && count > 0) {
                const rightPlane = new THREE.Mesh(
                    new THREE.PlaneGeometry(lastCageInfo.length * 0.85, lastCageInfo.height * 0.45),
                    lastCageInfo.rightMaterial
                );
                const lastXOffset = (count - 1) * width - ((count - 1) * width / 2);
                rightPlane.position.set(lastXOffset + width / 2 + 0.1, 0, 0);
                rightPlane.rotation.y = -Math.PI / 2;
                scene.add(rightPlane);
                textLabels.push(rightPlane);
            }
            
            // Adjust camera position based on number of cages
            if (count > 1) {
                const totalWidth = count * width;
                camera.position.set(totalWidth * 0.7, totalWidth * 0.8, totalWidth * 0.9);
                camera.lookAt(0, 0, 0);
            } else {
                camera.position.set(50, 60, 70);
                camera.lookAt(0, 0, 0);
            }
            
            // Update dimensions display with whole numbers
            document.getElementById('dimensionsDisplay').textContent = 
                `Length: ${length} ft × Width: ${width} ft × Height: ${height} ft × Count: ${count}`;
                
            // Update total square feet
            updateTotalSquareFeet(length, width, count);
            updateTotalSquareFeetNet(length, width, height, count);
        }
        
        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        
        // Handle window resize
        function onWindowResize() {
            const container = document.querySelector('.canvas-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }
        
        // Handle form submission
        document.getElementById('dimensionsForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const length = parseFloat(document.getElementById('length').value);
            const width = parseFloat(document.getElementById('width').value);
            const height = parseFloat(document.getElementById('height').value);
            const cageCount = parseInt(document.getElementById('cageCount').value);
            
            if (length > 0 && width > 0 && height > 0 && cageCount > 0) {
                createCages(length, width, height, cageCount);
            }
        });
        
        // Handle input changes for real-time updates
        const inputs = document.querySelectorAll('#dimensionsForm input');
        inputs.forEach(input => {
            input.addEventListener('input', function() {
                const length = parseFloat(document.getElementById('length').value) || 70;
                const width = parseFloat(document.getElementById('width').value) || 14;
                const height = parseFloat(document.getElementById('height').  || 14;
                const height = parseFloat(document.getElementById('height').value) || 12;
                const cageCount = parseInt(document.getElementById('cageCount').value) || 1;
                
                if (length > 0 && width > 0 && height > 0 && cageCount > 0) {

        });
        
        // Initialize the scene when the page loads
