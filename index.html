<head>

    <title>ATX TURF - Batting Cage Dimensions</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>

    <style>
        :root {
            --primary: #00ff9d;
            --primary-dark: #00cc7d;
            --secondary: #0a1a12;
            --accent: #00ffcc;
            --text: #e0ffe9;
            --background: #0a1a12;
            --card: #112218;
            --atx-green: #008f39; /* Darker green for ATXTurf text */
            --floor-green: #00ff4c; /* Brighter green for the floor */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0.75rem;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 255, 157, 0.05) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(0, 255, 204, 0.05) 0%, transparent 20%);
        }

        .container {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.75rem;
            margin-top: 0.5rem;
        }

        @media (min-width: 768px) {
            .container {
                grid-template-columns: 1.5fr 1fr;
            }
        }

        .form-container {
            background-color: var(--card);
            border-radius: 0.75rem;
            padding: 0.75rem;
            box-shadow: 0 8px 32px rgba(0, 255, 157, 0.1);
            border: 1px solid rgba(0, 255, 157, 0.1);
            backdrop-filter: blur(4px);
        }

        h1 {
            color: var(--primary);
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 1rem;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            padding-bottom: 0.25rem;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 25%;
            width: 50%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
        }

        .form-group {
            margin-bottom: 0.5rem;
            position: relative;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.25rem;
            color: var(--primary);
            font-weight: 500;
            font-size: 0.85rem;
        }

        input {
            width: 100%;
            padding: 0.5rem;
            border-radius: 0.5rem;
            border: 1px solid rgba(0, 255, 157, 0.3);
            background-color: rgba(10, 26, 18, 0.8);
            color: var(--text);
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        /* Ensure number input controls are visible */
        input[type="number"] {
            -moz-appearance: textfield; /* Firefox */
            padding-right: 1.5rem; /* Make room for custom controls */
        }

        /* Hide default controls but keep them accessible */
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { 
            -webkit-appearance: none;
            margin: 0;
        }

        /* Custom number controls */
        .number-controls {
            position: absolute;
            right: 0;
            top: 1.4rem; /* Position below label */
            display: flex;
            flex-direction: column;
            height: calc(100% - 1.4rem);
        }

        .number-control {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 1.5rem;
            height: 50%;
            background-color: rgba(0, 255, 157, 0.2);
            color: var(--text);
            font-size: 0.8rem;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.2s;
        }

        .number-control:first-child {
            border-top-right-radius: 0.5rem;
        }

        .number-control:last-child {
            border-bottom-right-radius: 0.5rem;
        }

        .number-control:hover {
            background-color: rgba(0, 255, 157, 0.4);
        }

        .number-control:active {
            background-color: rgba(0, 255, 157, 0.6);
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(0, 255, 157, 0.2);
        }

        /* Checkbox styling */
        .checkbox-container {
            display: flex;
            align-items: center;
            margin: 0.5rem 0;
            padding: 0.5rem;
            background-color: rgba(0, 255, 157, 0.1);
            border-radius: 0.5rem;
            border: 1px solid rgba(0, 255, 157, 0.2);
        }

        .checkbox-container input[type="checkbox"] {
            width: auto;
            margin-right: 0.5rem;
            cursor: pointer;
            accent-color: var(--primary);
        }

        .checkbox-container label {
            margin-bottom: 0;
            cursor: pointer;
            font-size: 0.85rem;
        }

        /* Remnant roll info styling */
        .remnant-info {
            margin: 0.5rem 0;
            padding: 0.5rem;
            background-color: rgba(0, 255, 204, 0.1);
            border-radius: 0.5rem;
            border: 1px solid rgba(0, 255, 204, 0.2);
        }

        .remnant-info-title {
            display: block;
            font-size: 0.8rem;
            margin-bottom: 0.25rem;
            color: var(--primary);
            font-weight: 500;
        }

        .remnant-info-content {
            font-size: 0.85rem;
            color: var(--text);
        }

        .remnant-info-line {
            margin-bottom: 0.25rem;
        }

        .remnant-info-value {
            font-weight: 700;
            color: var(--accent);
        }

        /* Seam info styling */
        .seam-info {
            margin: 0.5rem 0;
            padding: 0.5rem;
            background-color: rgba(0, 255, 157, 0.1);
            border-radius: 0.5rem;
            border: 1px solid rgba(0, 255, 157, 0.2);
        }

        .seam-info-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .seam-info-label {
            font-size: 0.8rem;
            color: var(--primary);
            font-weight: 500;
        }

        .seam-info-value {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent);
        }

        .inline-checkbox {
            display: flex;
            align-items: center;
            margin-left: 1rem;
        }

        .inline-checkbox input[type="checkbox"] {
            margin-right: 0.25rem;
            cursor: pointer;
            accent-color: var(--primary);
        }

        .inline-checkbox label {
            margin-bottom: 0;
            cursor: pointer;
            font-size: 0.75rem;
        }

        .totals-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .total-square-feet {
            padding: 0.5rem;
            background-color: rgba(0, 255, 157, 0.1);
            border-radius: 0.5rem;
            border: 1px solid rgba(0, 255, 157, 0.2);
        }

        .total-square-feet-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .total-square-feet-label {
            font-size: 0.8rem;
            color: var(--primary);
            font-weight: 500;
        }

        .total-square-feet-value {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text);
        }

        .total-square-feet-net {
            text-align: center;
            padding: 0.5rem;
            background-color: rgba(0, 255, 204, 0.1);
            border-radius: 0.5rem;
            border: 1px solid rgba(0, 255, 204, 0.2);
        }

        .cost-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .cost-turf {
            text-align: center;
            padding: 0.5rem;
            background-color: rgba(0, 255, 157, 0.15);
            border-radius: 0.5rem;
            border: 1px solid rgba(0, 255, 157, 0.3);
        }

        .cost-net {
            text-align: center;
            padding: 0.5rem;
            background-color: rgba(0, 255, 204, 0.15);
            border-radius: 0.5rem;
            border: 1px solid rgba(0, 255, 204, 0.3);
        }

        .cost-label {
            display: block;
            font-size: 0.7rem;
            margin-bottom: 0.25rem;
            color: var(--primary);
        }

        .cost-value {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text);
        }

        .total-cost-container {
            margin-top: 0.5rem;
            text-align: center;
        }

        .total-cost {
            display: inline-block;
            padding: 0.5rem 1.5rem;
            background: linear-gradient(90deg, rgba(0, 255, 157, 0.2), rgba(0, 255, 204, 0.2));
            border-radius: 0.5rem;
            border: 1px solid rgba(0, 255, 157, 0.3);
        }

        .total-cost-label {
            display: block;
            font-size: 0.7rem;
            margin-bottom: 0.25rem;
            color: var(--primary);
            font-weight: 500;
        }

        .total-cost-value {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text);
        }

        .additional-note {
            text-align: center;
            margin-top: 0.5rem;
            font-size: 0.7rem;
            color: rgba(224, 255, 233, 0.7);
            font-style: italic;
        }

        .gravel-note {
            text-align: center;
            margin-top: 0.25rem;
            font-size: 0.7rem;
            color: rgba(224, 255, 233, 0.7);
        }

        .canvas-container {
            background-color: var(--card);
            border-radius: 0.75rem;
            overflow: hidden;
            position: relative;
            aspect-ratio: 16/15.21;
            box-shadow: 0 8px 32px rgba(0, 255, 157, 0.1);
            border: 1px solid rgba(0, 255, 157, 0.1);
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .dimensions-display {
            position: absolute;
            bottom: 1rem;
            left: 1rem;
            background-color: rgba(10, 26, 18, 0.8);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            border-left: 3px solid var(--primary);
            font-size: 0.5rem;
        }

        .instructions {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background-color: rgba(10, 26, 18, 0.8);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.7rem;
            color: var(--text);
            opacity: 0.8;
        }

        .powered-by {
            position: absolute;
            top: 1rem;
            left: 1rem;
            background-color: rgba(10, 26, 18, 0.8);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.8rem; /* Increased from 0.7rem */
            color: var(--text);
            border-left: 3px solid var(--atx-green);
            z-index: 10;
        }

        .powered-by span {
            color: var(--atx-green);
            font-weight: 600;
        }

        .powered-by a {
            text-decoration: none;
            color: inherit;
            transition: opacity 0.2s ease;
        }

        .powered-by a:hover {
            opacity: 0.8;
        }

        /* Mobile-specific adjustments */
        @media (max-width: 767px) {
            .container {
                gap: 0.5rem;
            }
            
            .canvas-container {
                aspect-ratio: 16/12; /* Shorter viewport on mobile */
            }
            
            .form-container {
                padding: 0.75rem;
            }
            
            .dimensions-display, .instructions {
                padding: 0.25rem 0.5rem;
                font-size: 0.6rem;
            }
            
            .powered-by {
                padding: 0.25rem 0.5rem;
                font-size: 0.7rem; /* Slightly larger on mobile too */
            }
            
            /* Ensure number controls are visible and easy to tap on mobile */
            .number-control {
                width: 1.8rem;
                font-size: 1rem;
            }
            
            /* Ensure instructions and powered-by don't overlap */
            .instructions {
                top: 3rem;
            }
        }

        .paypal-button-container {
            margin-top: 0.5rem;
            width: 100%;
            max-width: 250px;
            margin-left: auto;
            margin-right: auto;
        }

        .seam-info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .seam-info-value-container {
            display: flex;
            align-items: center;
        }

        .customer-info-section {
            margin-top: 1rem;
            padding: 0.75rem;
            background-color: rgba(0, 255, 157, 0.1);
            border-radius: 0.75rem;
            border: 1px solid rgba(0, 255, 157, 0.2);
            display: none; /* Hidden by default */
        }

        .customer-info-section.active {
            display: block;
        }

        .customer-info-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            padding: 0.5rem;
            background-color: rgba(0, 255, 157, 0.15);
            border-radius: 0.5rem;
            margin-top: 1rem;
        }

        .customer-info-header h2 {
            font-size: 0.9rem;
            margin: 0;
            color: var(--primary);
        }

        .customer-info-toggle {
            color: var(--text);
            font-size: 1.2rem;
            transition: transform 0.3s ease;
        }

        .customer-info-toggle.active {
            transform: rotate(180deg);
        }

        .customer-form-group {
            margin-bottom: 0.75rem;
        }

        .customer-form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        .required-field::after {
            content: "*";
            color: #ff3e3e;
            margin-left: 0.25rem;
        }

        .payment-error {
            color: #ff3e3e;
            font-size: 0.8rem;
            margin-top: 0.5rem;
            display: none;
        }

        .payment-error.visible {
            display: block;
        }

        textarea {
            width: 100%;
            padding: 0.5rem;
            border-radius: 0.5rem;
            border: 1px solid rgba(0, 255, 157, 0.3);
            background-color: rgba(10, 26, 18, 0.8);
            color: var(--text);
            font-size: 0.9rem;
            transition: all 0.3s ease;
            resize: vertical;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(0, 255, 157, 0.2);
        }

        /* Add this CSS for the order confirmation modal */
        .order-confirmation-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
        }

        .order-confirmation-modal.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background-color: var(--card);
            border-radius: 0.75rem;
            padding: 1.5rem;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid var(--primary);
            box-shadow: 0 0 20px rgba(0, 255, 157, 0.3);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(0, 255, 157, 0.3);
        }

        .modal-header h2 {
            color: var(--primary);
            font-size: 1.2rem;
            margin: 0;
        }

        .close-modal {
            background: none;
            border: none;
            color: var(--text);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0;
            line-height: 1;
        }

        .order-summary {
            margin-bottom: 1.5rem;
        }

        .order-summary h3 {
            color: var(--primary);
            font-size: 1rem;
            margin: 1rem 0 0.5rem;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .summary-item-label {
            color: var(--text);
            opacity: 0.8;
        }

        .summary-item-value {
            color: var(--text);
            font-weight: 600;
        }

        .summary-total {
            margin-top: 1rem;
            padding-top: 0.5rem;
            border-top: 1px solid rgba(0, 255, 157, 0.3);
            font-size: 1.1rem;
            font-weight: 700;
        }

        .modal-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 1.5rem;
        }

        .modal-button {
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .cancel-button {
            background-color: rgba(255, 255, 255, 0.1);
            color: var(--text);
        }

        .cancel-button:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        .confirm-button {
            background-color: var(--primary-dark);
            color: var(--text);
        }

        .confirm-button:hover {
            background-color: var(--primary);
        }

        /* Shipping calculator styles */
        .shipping-calculator {
            margin: 0.5rem 0;
            padding: 0.5rem;
            background-color: rgba(0, 255, 204, 0.1);
            border-radius: 0.5rem;
            border: 1px solid rgba(0, 255, 204, 0.2);
        }

        .shipping-calculator-title {
            display: block;
            font-size: 0.8rem;
            margin-bottom: 0.25rem;
            color: var(--primary);
            font-weight: 500;
        }

        .shipping-calculator-content {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .shipping-zip-container {
            display: flex;
            gap: 0.5rem;
        }

        .shipping-zip-container input {
            flex: 1;
        }

        .shipping-zip-container button {
            background-color: var(--primary-dark);
            color: var(--text);
            border: none;
            border-radius: 0.5rem;
            padding: 0 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .shipping-zip-container button:hover {
            background-color: var(--primary);
        }

        .shipping-result {
            display: none;
            margin-top: 0.5rem;
        }

        .shipping-result.visible {
            display: block;
        }

        .shipping-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.25rem;
        }

        .shipping-info-label {
            font-size: 0.8rem;
            color: var(--text);
            opacity: 0.8;
        }

        .shipping-info-value {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--accent);
        }

        .shipping-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.5rem;
            padding-top: 0.5rem;
            border-top: 1px solid rgba(0, 255, 157, 0.2);
        }

        .shipping-total-label {
            font-size: 0.9rem;
            color: var(--primary);
            font-weight: 500;
        }

        .shipping-total-value {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text);
        }

        .shipping-error {
            color: #ff3e3e;
            font-size: 0.8rem;
            margin-top: 0.5rem;
            display: none;
        }

        .shipping-error.visible {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="canvas-container">
            <canvas id="cageCanvas"></canvas>
            <div class="dimensions-display" id="dimensionsDisplay">
                Length: 70 ft × Width: 14 ft × Height: 12 ft
            </div>
            <div class="instructions">
                Drag to rotate | Pinch to zoom
            </div>
            <div class="powered-by">
                Powered by <a href="https://www.atxturf.com" target="_blank" rel="noopener noreferrer"><span>ATXTurf, LLC</span></a>
            </div>
        </div>
        <div class="form-container">
            <h1>Enter Cage Size</h1>
            <form id="dimensionsForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="length">Length (feet)</label>
                        <input type="number" id="length" name="length" min="1" step="1" value="70" required>
                        <div class="number-controls">
                            <div class="number-control" data-input="length" data-action="increment">+</div>
                            <div class="number-control" data-input="length" data-action="decrement">-</div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="width">Width (feet)</label>
                        <input type="number" id="width" name="width" min="10" step="1" value="14" required>
                        <div class="number-controls">
                            <div class="number-control" data-input="width" data-action="increment">+</div>
                            <div class="number-control" data-input="width" data-action="decrement">-</div>
                        </div>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="height">Height (feet)</label>
                        <input type="number" id="height" name="height" min="1" step="1" value="12" required>
                        <div class="number-controls">
                            <div class="number-control" data-input="height" data-action="increment">+</div>
                            <div class="number-control" data-input="height" data-action="decrement">-</div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="cageCount">How Many Cages?</label>
                        <input type="number" id="cageCount" name="cageCount" min="1" max="10" step="1" value="1" required>
                        <div class="number-controls">
                            <div class="number-control" data-input="cageCount" data-action="increment">+</div>
                            <div class="number-control" data-input="cageCount" data-action="decrement">-</div>
                        </div>
                    </div>
                </div>
                
                <!-- Checkbox to flip line direction -->
                <div class="checkbox-container">
                    <input type="checkbox" id="flipLines" name="flipLines">
                    <label for="flipLines">Check to Flip Turf Roll Direction</label>
